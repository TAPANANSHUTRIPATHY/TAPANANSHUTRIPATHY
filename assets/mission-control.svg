<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">Tapananshu Tripathy - field systems profile</title>
  <desc id="desc">A dark, starfield-inspired mission control panel in cyan and violet. It shows a camera-to-vision-model-to-field-response pipeline and project signals for CrimeNetra, wildlife monitoring, and IoT sensor systems.</desc>
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070e"/>
      <stop offset="0.58" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#11102a"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#25d9f5"/>
      <stop offset="0.52" stop-color="#6978ff"/>
      <stop offset="1" stop-color="#bb78ff"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7beaff"/>
      <stop offset="0.52" stop-color="#6689ff"/>
      <stop offset="1" stop-color="#bf8bff"/>
    </linearGradient>
    <radialGradient id="nebula" cx="0.82" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#4c4dff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4c4dff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#a8b8df" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="cyanGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="1280" height="560" rx="28" fill="url(#backdrop)"/>
  <rect width="1280" height="560" rx="28" fill="url(#nebula)"/>
  <rect width="1280" height="560" rx="28" fill="url(#grid)"/>
  <g fill="#d8e9ff">
    <circle cx="91" cy="117" r="1.4" opacity=".42"/><circle cx="192" cy="45" r="1.2" opacity=".55"/>
    <circle cx="316" cy="307" r="1.3" opacity=".34"/><circle cx="536" cy="79" r="1.1" opacity=".52"/>
    <circle cx="619" cy="452" r="1.4" opacity=".4"/><circle cx="687" cy="78" r="1.2" opacity=".55"/>
    <circle cx="1209" cy="82" r="1.4" opacity=".48"/><circle cx="1238" cy="205" r="1" opacity=".5"/>
    <circle cx="1185" cy="463" r="1.3" opacity=".45"/><circle cx="841" cy="492" r="1" opacity=".38"/>
    <circle cx="478" cy="499" r="1.2" opacity=".35"/><circle cx="69" cy="430" r="1.2" opacity=".45"/>
    <circle cx="1020" cy="54" r="1" opacity=".4"/><circle cx="1102" cy="517" r="1.1" opacity=".45"/>
  </g>
  <circle cx="921" cy="251" r="188" fill="#4f46e5" opacity=".12" filter="url(#softGlow)"/>
  <rect x="17" y="17" width="1246" height="526" rx="22" fill="none" stroke="#a9bbef" stroke-opacity=".2"/>
  <path d="M40 18H418" stroke="url(#edge)" stroke-width="3" filter="url(#cyanGlow)"/>
  <path d="M418 18H742" stroke="#b67cff" stroke-opacity=".65" stroke-width="1"/>

  <!-- Identity rail -->
  <rect x="54" y="48" width="42" height="42" rx="12" fill="#101b31" stroke="#4b76ab" stroke-opacity=".8"/>
  <text x="75" y="76" text-anchor="middle" fill="url(#edge)" font-family="Arial, sans-serif" font-size="18" font-weight="800">TT</text>
  <text x="112" y="64" fill="#eff5ff" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2.4">TAPANANSHU TRIPATHY</text>
  <text x="112" y="82" fill="#7e91b4" font-family="Consolas, monospace" font-size="10" letter-spacing="2">FIELD SYSTEMS / PROFILE 001</text>
  <rect x="1005" y="52" width="218" height="34" rx="17" fill="#0d1725" stroke="#31d2ec" stroke-opacity=".42"/>
  <circle cx="1024" cy="69" r="4" fill="#54e7c2" filter="url(#cyanGlow)"/>
  <text x="1038" y="73" fill="#b4c8e8" font-family="Consolas, monospace" font-size="10" letter-spacing="1.4">BHUBANESWAR / IN</text>

  <!-- Glitch title treatment -->
  <text x="55" y="185" fill="#42e3ff" opacity=".22" font-family="Arial, sans-serif" font-size="61" font-weight="800" letter-spacing="1.2">TAPANANSHU</text>
  <text x="61" y="185" fill="#b76cff" opacity=".2" font-family="Arial, sans-serif" font-size="61" font-weight="800" letter-spacing="1.2">TAPANANSHU</text>
  <text x="58" y="185" fill="#f3f6ff" font-family="Arial, sans-serif" font-size="61" font-weight="800" letter-spacing="1.2">TAPANANSHU</text>
  <text x="53" y="255" fill="#47dcf4" opacity=".2" font-family="Arial, sans-serif" font-size="65" font-weight="800" letter-spacing="4">TRIPATHY</text>
  <text x="60" y="255" fill="#b679ff" opacity=".18" font-family="Arial, sans-serif" font-size="65" font-weight="800" letter-spacing="4">TRIPATHY</text>
  <text x="57" y="255" fill="url(#name)" font-family="Arial, sans-serif" font-size="65" font-weight="800" letter-spacing="4">TRIPATHY</text>
  <text x="61" y="288" fill="#8294b8" font-family="Consolas, monospace" font-size="11" letter-spacing="2.1">CSE / DATA SCIENCE / KIIT '28</text>

  <text x="58" y="343" fill="#f1f5ff" font-family="Arial, sans-serif" font-size="25" font-weight="700">Pixels in. Decisions out.</text>
  <text x="60" y="369" fill="#a5b4d0" font-family="Arial, sans-serif" font-size="14">AI that leaves the notebook and meets the real world.</text>

  <!-- Three-stage personal build loop -->
  <g font-family="Consolas, monospace" font-size="10" letter-spacing="1.2">
    <rect x="58" y="404" width="154" height="42" rx="10" fill="#101a2b" stroke="#36d3ef" stroke-opacity=".48"/>
    <circle cx="76" cy="425" r="5" fill="#36d3ef"/>
    <text x="91" y="429" fill="#e4f2ff">01 / SENSE</text>
    <path d="M219 425h29m-6-6 6 6-6 6" fill="none" stroke="#7487bb" stroke-width="1.5"/>
    <rect x="258" y="404" width="154" height="42" rx="10" fill="#11182c" stroke="#7880ff" stroke-opacity=".6"/>
    <circle cx="276" cy="425" r="5" fill="#8b82ff"/>
    <text x="291" y="429" fill="#e4e7ff">02 / INFER</text>
    <path d="M419 425h29m-6-6 6 6-6 6" fill="none" stroke="#8990c6" stroke-width="1.5"/>
    <rect x="458" y="404" width="154" height="42" rx="10" fill="#17152b" stroke="#b178ff" stroke-opacity=".55"/>
    <circle cx="476" cy="425" r="5" fill="#bb79ff"/>
    <text x="491" y="429" fill="#f0e7ff">03 / RESPOND</text>
  </g>
  <text x="60" y="492" fill="#647392" font-family="Consolas, monospace" font-size="10" letter-spacing="1.3">SIDE QUESTS: DRONES, SENSOR BOARDS &amp; RASNA-FUELLED DEBUGGING</text>

  <!-- Signal path panel -->
  <rect x="660" y="112" width="567" height="368" rx="18" fill="#090e1b" fill-opacity=".82" stroke="#7886ad" stroke-opacity=".34"/>
  <path d="M660 145H1227" stroke="#6b7da6" stroke-opacity=".2"/>
  <circle cx="684" cy="130" r="3" fill="#4bd9f0"/>
  <text x="698" y="134" fill="#aebbd6" font-family="Consolas, monospace" font-size="10" letter-spacing="1.6">SYSTEM TRACE / FROM INPUT TO IMPACT</text>
  <text x="1198" y="134" text-anchor="end" fill="#737fa0" font-family="Consolas, monospace" font-size="9">PROJECT READOUT</text>

  <!-- Node 1: live camera input -->
  <rect x="683" y="169" width="151" height="142" rx="12" fill="#101a2a" stroke="#36d3ef" stroke-opacity=".52"/>
  <text x="700" y="190" fill="#5cdff2" font-family="Consolas, monospace" font-size="9" letter-spacing="1.5">INPUT / 01</text>
  <rect x="704" y="204" width="53" height="37" rx="5" fill="none" stroke="#a6edfa" stroke-width="1.5"/>
  <circle cx="730" cy="222" r="10" fill="none" stroke="#39d3ef" stroke-width="2"/>
  <circle cx="730" cy="222" r="3" fill="#9cf3ff"/>
  <path d="M757 213l13-8v34l-13-8" fill="none" stroke="#a6edfa" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="700" y="265" fill="#f0f4fc" font-family="Arial, sans-serif" font-size="13" font-weight="700">CAMERA / VIDEO</text>
  <text x="700" y="284" fill="#8495b5" font-family="Consolas, monospace" font-size="9">RTSP / IP / LIVE FEED</text>

  <!-- Node 2: AI inference -->
  <rect x="868" y="169" width="151" height="142" rx="12" fill="#11162b" stroke="#7c83ff" stroke-opacity=".6"/>
  <text x="885" y="190" fill="#9a9cff" font-family="Consolas, monospace" font-size="9" letter-spacing="1.5">INFERENCE / 02</text>
  <g stroke="#8d92ff" stroke-opacity=".75" stroke-width="1.2" fill="#c3baff">
    <path d="M901 211l24 11m-24 11 24-11m24-11-24 11m24 11-24-11m24-11 24 11m-24 11 24-11" fill="none"/>
    <circle cx="901" cy="211" r="3"/><circle cx="901" cy="233" r="3"/><circle cx="925" cy="222" r="4"/>
    <circle cx="949" cy="211" r="3"/><circle cx="949" cy="233" r="3"/><circle cx="973" cy="222" r="4"/>
  </g>
  <text x="885" y="265" fill="#f0f4fc" font-family="Arial, sans-serif" font-size="13" font-weight="700">VISION MODEL</text>
  <text x="885" y="284" fill="#9398c3" font-family="Consolas, monospace" font-size="9">YOLOv8 / ASTNet</text>

  <!-- Node 3: physical response -->
  <rect x="1053" y="169" width="151" height="142" rx="12" fill="#19142b" stroke="#bb7cff" stroke-opacity=".58"/>
  <text x="1070" y="190" fill="#cb9aff" font-family="Consolas, monospace" font-size="9" letter-spacing="1.5">OUTPUT / 03</text>
  <rect x="1089" y="204" width="42" height="37" rx="5" fill="none" stroke="#e1c3ff" stroke-width="1.5"/>
  <path d="M1083 211h6m-6 10h6m-6 10h6m42-20h6m-6 10h6m-6 10h6M1100 198v6m20-6v6m-20 37v6m20-6v6" stroke="#d7a8ff" stroke-width="1.4"/>
  <path d="M1099 223l7 6 14-15" fill="none" stroke="#5ce7c4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1070" y="265" fill="#f5f0ff" font-family="Arial, sans-serif" font-size="13" font-weight="700">FIELD RESPONSE</text>
  <text x="1070" y="284" fill="#a799bb" font-family="Consolas, monospace" font-size="9">ALERT / CONTROL</text>

  <!-- Signal connectors -->
  <path d="M836 238h26m-7-6 7 6-7 6M1020 238h26m-7-6 7 6-7 6" fill="none" stroke="url(#edge)" stroke-width="1.8" filter="url(#cyanGlow)"/>

  <!-- Three real project signals -->
  <path d="M683 330H1204" stroke="#7886ad" stroke-opacity=".2"/>
  <path d="M857 343v104M1032 343v104" stroke="#7886ad" stroke-opacity=".23"/>
  <text x="700" y="362" fill="#56dcf0" font-family="Consolas, monospace" font-size="19" font-weight="700">~90%</text>
  <text x="700" y="380" fill="#aab8d0" font-family="Arial, sans-serif" font-size="10">CrimeNetra accuracy</text>
  <text x="700" y="399" fill="#71819f" font-family="Consolas, monospace" font-size="9">7+ EVENT CATEGORIES</text>
  <text x="881" y="362" fill="#9a9dff" font-family="Consolas, monospace" font-size="19" font-weight="700">25+ FPS</text>
  <text x="881" y="380" fill="#aab8d0" font-family="Arial, sans-serif" font-size="10">Wildlife detection</text>
  <text x="881" y="399" fill="#71819f" font-family="Consolas, monospace" font-size="9">LIVE CAMERA STREAM</text>
  <text x="1054" y="362" fill="#c690ff" font-family="Consolas, monospace" font-size="19" font-weight="700">9 SENSORS</text>
  <text x="1054" y="380" fill="#aab8d0" font-family="Arial, sans-serif" font-size="10">Connected IoT systems</text>
  <text x="1054" y="399" fill="#71819f" font-family="Consolas, monospace" font-size="9">SENSE / MONITOR / ACT</text>

  <!-- Small signal trace and footer -->
  <path d="M700 433h55l7-8 7 15 10-22 9 15 7-5h39m18 0h57l7-8 7 15 10-22 9 15 7-5h39m18 0h57l7-8 7 15 10-22 9 15 7-5h28" fill="none" stroke="url(#edge)" stroke-width="1.4" opacity=".68"/>
  <text x="700" y="462" fill="#667795" font-family="Consolas, monospace" font-size="9" letter-spacing="1.3">CSE / DATA SCIENCE  ·  COMPUTER VISION  ·  EDGE SYSTEMS</text>
</svg>
